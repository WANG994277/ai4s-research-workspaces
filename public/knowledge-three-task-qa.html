<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>知识中心三项任务对照</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #eef3f9; color: #173b69; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
    main { width: min(1500px, 100%); margin: 0 auto; padding: 24px; }
    h1 { margin: 0 0 18px; font-size: 24px; }
    section { margin-bottom: 24px; overflow: hidden; border: 1px solid #d8e3f0; border-radius: 12px; background: #fff; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid #e3eaf3; }
    header h2 { margin: 0; font-size: 16px; }
    header span { color: #7186a2; font-size: 12px; }
    .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: #dfe8f3; }
    figure { position: relative; height: 520px; margin: 0; overflow: hidden; background: #f7faff; }
    figcaption { position: absolute; z-index: 2; top: 10px; left: 10px; padding: 5px 9px; border-radius: 999px; background: rgba(13,45,92,.82); color: #fff; font-size: 11px; }
    img { width: 100%; height: 100%; object-fit: contain; background: #f6f9fd; }
    iframe { width: 1536px; height: 1024px; border: 0; transform: scale(.48); transform-origin: top left; background: #fff; }
  </style>
</head>
<body>
  <main>
    <h1>知识中心三项任务——需求截图 / 3002 实现同屏对照</h1>
    <section>
      <header><h2>1. 知识资产双页签与知识库补齐</h2><span>旧页空白 → 完整列表/详情</span></header>
      <div class="compare"><figure><figcaption>需求截图</figcaption><img src="/v1/qa/knowledge-library-before.png" alt="旧知识库空页" /></figure><figure><figcaption>当前实现</figcaption><iframe src="/knowledge?tab=%E7%9F%A5%E8%AF%86%E5%BA%93"></iframe></figure></div>
    </section>
    <section>
      <header><h2>2. 知识图谱工具栏精简</h2><span>移除设置/导出/全屏</span></header>
      <div class="compare"><figure><figcaption>需求标注</figcaption><img src="/v1/qa/knowledge-graph-controls-before.png" alt="需要移除的图谱按钮" /></figure><figure><figcaption>当前实现</figcaption><iframe src="/knowledge?tab=%E7%9F%A5%E8%AF%86%E5%9B%BE%E8%B0%B1"></iframe></figure></div>
    </section>
    <section>
      <header><h2>3. 文献 AI 助手通用化</h2><span>卡片网格 → 对话面板 + 能力对话框</span></header>
      <div class="compare"><figure><figcaption>需求标注</figcaption><img src="/v1/qa/literature-ai-before.png" alt="旧文献 AI 助手" /></figure><figure><figcaption>当前实现</figcaption><iframe src="/knowledge?id=k-paper&amp;searched=1&amp;q=%E5%82%A8%E5%B1%82&amp;mode=%E6%99%BA%E8%83%BD%E6%A3%80%E7%B4%A2"></iframe></figure></div>
    </section>
    <section>
      <header><h2>4. 知识图谱目录</h2><span>参考高密度列表，操作色改为 AI4S 蓝</span></header>
      <div class="compare"><figure><figcaption>视觉参考</figcaption><img src="/v1/qa/knowledge-graph-catalog-reference.png" alt="知识图谱目录参考" /></figure><figure><figcaption>当前实现</figcaption><iframe src="/knowledge?tab=%E7%9F%A5%E8%AF%86%E5%9B%BE%E8%B0%B1"></iframe></figure></div>
    </section>
  </main>
</body>
</html>
